[package]
name = "fast-ereader"
version = "0.1.0"
edition = "2021"
description = "A fast, cross-platform local e-reader with bionic reading mode"

[dependencies]
# Async Runtime & Web Server
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-full"] }

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web Browser Integration
webbrowser = "1.0"

# EPUB Parsing
epub = "2.1"

# HTML Parsing & Sanitization
scraper = "0.20"
ammonia = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities & State
uuid = { version = "1.10", features = ["v4"] }
directories = "5.0"
parking_lot = "0.12"
dashmap = "6.0"
bytes = "1.6"
mime_guess = "2.0"
blake3 = "1.5" # Fast hashing for cache keys
url = "2.5"
